# Pinned tool versions. `mise install` installs them; CI uses the same file.
# Flutter's version must match `flutter:` in the root pubspec.yaml.
[tools]
flutter = "3.50.1"
node = "26.13.1"
gitleaks = "8.30.1"
just = "1.59.0"
"npm:markdownlint-cli2" = "0.23.3"
osv-scanner = "2.7.0"
prek = "0.5.5"
typos = "1.51.1"
zizmor = "1.31.1"
