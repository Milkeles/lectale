      - {$ref: '#/components/parameters/sha'}
    get:
      operationId: getPreview
      summary: Reload a pinned public course preview
      description: >
        Return the same validated CoursePreview as import. The SHA must have been pinned by import
        for this repository or be reachable from its default branch (E3, V4-CORE-01).
      security: []
      responses:
        '200':
          description: Validated preview at a single pinned commit
          headers:
            Cache-Control: {$ref: '#/components/headers/PublicPreviewCache'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CoursePreview'}
        '404': {$ref: '#/components/responses/PreviewUnavailable'}
        '429': {$ref: '#/components/responses/PreviewThrottled'}
        4XX: {$ref: '#/components/responses/ClientError'}
        5XX: {$ref: '#/components/responses/ServerError'}
  /preview/{repoId}/{sha}/readme:
    parameters:
      - {$ref: '#/components/parameters/repoId'}
      - {$ref: '#/components/parameters/sha'}
      - {$ref: '#/components/parameters/PreviewRange'}
    get:
      operationId: getPreviewReadme
      summary: Fetch the root README for a pinned public preview
      description: >
        Return root README.md as UTF-8 Markdown from the pinned commit of an unambiguously public
        repository. Render it using a safe Markdown renderer (README-001, README-003). Cache class B
        applies only to public immutable bytes, keyed by numeric repository ID, full SHA, normalized
        README path and renderer version (E3, CACHE-005).
      security: []
      responses:
        '200':
          description: Root README Markdown
          headers:
            Cache-Control: {$ref: '#/components/headers/PublicPreviewCache'}
            Content-Security-Policy: {$ref: '#/components/headers/PreviewContentPolicy'}
            X-Content-Type-Options: {$ref: '#/components/headers/PreviewNoSniff'}
          content:
            text/markdown:
              schema:
                type: string
        '206': {$ref: '#/components/responses/PreviewPartialFile'}
        '416': {$ref: '#/components/responses/PreviewInvalidRange'}
        '404': {$ref: '#/components/responses/PreviewUnavailable'}
        '429': {$ref: '#/components/responses/PreviewThrottled'}
        4XX: {$ref: '#/components/responses/ClientError'}
        5XX: {$ref: '#/components/responses/ServerError'}
  /preview/{repoId}/{sha}/content/{lessonId}/{resourceId}:
    parameters:
      - {$ref: '#/components/parameters/repoId'}
      - {$ref: '#/components/parameters/sha'}
      - {$ref: '#/components/parameters/lessonId'}
      - {$ref: '#/components/parameters/resourceId'}
      - {$ref: '#/components/parameters/PreviewRange'}
    get:
      operationId: getPreviewContent
      summary: Fetch a scoped resource from a pinned public preview
      description: >
        Use the resource href returned by import. Resolve the address against the validated manifest at
        the supplied SHA (bound to the repository as for preview reload) and serve only a canonical repository path from an unambiguously public repository
        (E2, E3, ADR-0008, V4-CORE-01). Cache class B applies to public immutable content, keyed by numeric
        repository ID, full SHA, normalized resource path and renderer version. The class D lookup applies
        when resolving the repository to a commit during import.
      security: []
      responses:
        '200': {$ref: '#/components/responses/PreviewFile'}
        '206': {$ref: '#/components/responses/PreviewPartialFile'}
        '404': {$ref: '#/components/responses/PreviewUnavailable'}
        '416': {$ref: '#/components/responses/PreviewInvalidRange'}
        '429': {$ref: '#/components/responses/PreviewThrottled'}
        4XX: {$ref: '#/components/responses/ClientError'}
        5XX: {$ref: '#/components/responses/ServerError'}
  /preview/{repoId}/{sha}/files/{path}:
    parameters:
      - {$ref: '#/components/parameters/repoId'}
      - {$ref: '#/components/parameters/sha'}
      - {$ref: '#/components/parameters/PreviewRange'}
      - name: path
        in: path
        required: true
        description: >
          Repository-relative path. Preserve literal slashes between segments. Dot segments,
          encoded separators, backslashes and non-allowlisted hidden entries are rejected.
        schema:
          type: string
          maxLength: 500
          pattern: '^(?:\.well-known|[A-Za-z0-9_-](?:[A-Za-z0-9_.-]*[A-Za-z0-9_-])?)(?:/(?:\.well-known|[A-Za-z0-9_-](?:[A-Za-z0-9_.-]*[A-Za-z0-9_-])?))*$'
    get:
      operationId: getPreviewFile
      summary: Fetch a file by repository-relative path
      description: >
        Serve a regular file from the bound public commit after validating its course manifest.
        Relative README assets, links and the course cover can use this route. Dart callers
        use Dio.openPreviewFile to preserve path separators and stream partial responses.
      security: []
      responses:
        '200': {$ref: '#/components/responses/PreviewFile'}
        '206': {$ref: '#/components/responses/PreviewPartialFile'}
        '404': {$ref: '#/components/responses/PreviewUnavailable'}
        '416': {$ref: '#/components/responses/PreviewInvalidRange'}
        '429': {$ref: '#/components/responses/PreviewThrottled'}
        4XX: {$ref: '#/components/responses/ClientError'}
        5XX: {$ref: '#/components/responses/ServerError'}
  /preview/{repoId}/{sha}/folders/{lessonId}/{resourceId}:
    parameters:
      - {$ref: '#/components/parameters/repoId'}
      - {$ref: '#/components/parameters/sha'}
      - {$ref: '#/components/parameters/lessonId'}
      - {$ref: '#/components/parameters/resourceId'}
    get:
      operationId: getPreviewFolder
      summary: List a pinned public folder resource
      description: >
        Resolve the folder resource through the validated manifest at the bound public commit.
        Return direct entries by default. If the resource enables recursive listing, visit
        entries in depth-first filename order. The resource's maxEntries (default 100)
        caps the total across all levels, counting directories as entries.
      security: []
      responses:
        '200':
          description: Folder entries with folder-relative names and file download addresses
          headers:
            Cache-Control: {$ref: '#/components/headers/PublicPreviewCache'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PreviewFolder'}
        '404': {$ref: '#/components/responses/PreviewUnavailable'}
        '429': {$ref: '#/components/responses/PreviewThrottled'}
        4XX: {$ref: '#/components/responses/ClientError'}
        5XX: {$ref: '#/components/responses/ServerError'}
components:
  securitySchemes:
    WebSession:
      type: apiKey
      in: cookie
      name: __Host-course_session
    FirebaseBearer:
      type: http
      scheme: bearer
      bearerFormat: FirebaseIDToken
    GitHubSignature:
      type: apiKey
      in: header
      name: X-Hub-Signature-256
      description: GitHub HMAC signature over the raw request bytes.
    StripeSignature:
      type: apiKey
      in: header
      name: Stripe-Signature
      description: Stripe signature over the raw request bytes.
  parameters:
    courseId:
      name: courseId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ManifestId'}
    lessonId:
      name: lessonId
      in: path
      required: true
      description: Lesson ID or assignment scope returned with the resource address (E2, ADR-0008).
      schema: {$ref: '#/components/schemas/ResourceParentId'}
    resourceId:
      name: resourceId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ManifestId'}
    assignmentId:
      name: assignmentId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/ManifestId'}
    uid:
      name: uid
      in: path
      required: true
      description: Target learner ID for an authorized staff operation.
      schema:
        type: string
        minLength: 1
    submissionId:
      name: submissionId
      in: path
      required: true
      schema:
        type: string
        pattern: ^sub_[a-z0-9]{16,40}$
    certificateId:
      name: certificateId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    orderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    jobId:
      name: jobId
      in: path
      required: true
      schema:
        type: string
        pattern: ^job_[A-Za-z0-9_-]{12,100}$
    documentType:
      name: documentType
      in: path
      required: true
      schema:
        type: string
        enum:
          - terms
          - privacy
          - cookies
          - accessibility
    noticeId:
      name: noticeId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
    repoId:
      name: repoId
      in: path
      required: true
      schema: {$ref: '#/components/schemas/GitHubRepoId'}
    sha:
      name: sha
      in: path
      required: true
      schema: {$ref: '#/components/schemas/CommitSha'}
    PreviewRange:
      name: Range
      in: header
      description: A single byte range. Multipart requests are rejected.
      schema:
        type: string
        maxLength: 128
        pattern: '^bytes=(?:[0-9]+-[0-9]*|-[0-9]+)$'
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Replay the same mutation with the same key within 24 hours to receive its first result
        (E7, V4-SEC-09).
      schema:
        type: string
        format: uuid
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from the previous page.
      schema:
        type: string
  headers:
    NoStore:
      description: The response may not be stored by caches.
      schema:
        type: string
        const: no-store
    PublicPreviewCache:
      description: Cache class B. Public cache directive with a bounded max-age.
      schema:
        type: string
        example: public, max-age=60, immutable, must-revalidate
    PreviewContentPolicy:
      schema:
        type: string
        const: "default-src 'none'; sandbox; frame-ancestors 'none'"
    PreviewNoSniff:
      schema:
        type: string
        const: nosniff
  responses:
    ClientError:
      description: Request rejected
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    ServerError:
      description: Service or upstream provider failure
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    PreviewFile:
      description: Regular file bytes. Active and unknown formats download as attachments.
      headers:
        Cache-Control: {$ref: '#/components/headers/PublicPreviewCache'}
        Content-Security-Policy: {$ref: '#/components/headers/PreviewContentPolicy'}
        X-Content-Type-Options: {$ref: '#/components/headers/PreviewNoSniff'}
        Content-Disposition:
          description: Attachment disposition for downloads.
          schema: {type: string}
      content: &previewMedia
        application/octet-stream:
          schema: {$ref: '#/components/schemas/BinaryContent'}
        text/plain:
          schema: {type: string}
        text/markdown:
          schema: {type: string}
        image/*:
          schema:
            $ref: '#/components/schemas/BinaryContent'
            description: Allowed raster image types with matching signatures.
        application/pdf:
          schema: {$ref: '#/components/schemas/BinaryContent'}
    PreviewPartialFile:
      description: One validated interval from the pinned file.
      headers:
        Cache-Control: {$ref: '#/components/headers/PublicPreviewCache'}
        Content-Security-Policy: {$ref: '#/components/headers/PreviewContentPolicy'}
        X-Content-Type-Options: {$ref: '#/components/headers/PreviewNoSniff'}
        Content-Disposition:
          description: Attachment disposition for downloads.
          schema: {type: string}
        Content-Range:
          required: true
          schema: {type: string}
      content: *previewMedia
    PreviewInvalidRange:
      description: Range is malformed or cannot be satisfied by the pinned file.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
        Content-Range:
          description: Unsatisfied byte range with the known file size, when available.
          schema: {type: string}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    PreviewUnavailable:
      description: Pinned public content is unavailable. Use the same response for private repositories
        and unsafe or unknown resource addresses.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
    PreviewThrottled:
      description: Preview request rate limited. Retry after the indicated delay when available.
      headers:
        Cache-Control: {$ref: '#/components/headers/NoStore'}
        Retry-After:
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ApiError'}
  schemas:
    ApiError:
      description: Stable error body with a safe user-facing message (E7, V4-SEC-09).
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - requestId
        - retryable
      properties:
        code:
          type: string
          description: Stable machine-readable code.
        message:
          type: string
          description: User-facing explanation with internal details redacted.
        requestId:
          type: string
          description: Opaque support reference.
        retryable:
          type: boolean
        retryAfterSeconds:
          type: number
          minimum: 0
        details:
          type: object
          description: Optional structured, code-specific diagnostics with sensitive values redacted.
          additionalProperties: true
    ManifestId:
      type: string
      pattern: ^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$
      maxLength: 80
    ResourceParentId:
      type: string
      pattern: '^(?:assignment~)?(?=[a-z0-9-]{1,80}$)[a-z][a-z0-9]*(?:-[a-z0-9]+)*$'
      maxLength: 91
      description: A manifest lesson ID or assignment~ followed by the manifest assignment ID.
    GitHubRepoId:
      type: integer
      format: int64
      minimum: 1
      description: Stable numeric GitHub repository ID.
    CommitSha:
      type: string
      pattern: ^[0-9a-f]{40}$
      description: Full pinned Git commit SHA in lowercase hexadecimal.
    Health:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          const: ok
    ImportCourseRequest:
      type: object
      additionalProperties: false
      required:
        - url
      properties:
        url:
          type: string
          format: uri
          pattern: ^https://github\.com/[A-Za-z0-9-]+/(?!(?:\.{1,2})/?$)[A-Za-z0-9_.-]+/?$
          description: HTTPS GitHub repository URL in owner/repository form.
          example: https://github.com/course-author/example-course
    PreviewFolder:
      type: object
      additionalProperties: false
      required: [entries]
      properties:
        entries:
          type: array
          maxItems: 1000
          items: {$ref: '#/components/schemas/PreviewFolderEntry'}
    PreviewFolderEntry:
      type: object
      additionalProperties: false
      required: [name, type, size]
      properties:
        name: {type: string, maxLength: 500, description: Path relative to the manifest folder root.}
        type: {type: string, enum: [file, directory]}
        size: {type: integer, format: int64, minimum: 0, description: Size in bytes. Zero for directories.}
        href:
          type: string
          description: Files-route address for a file. Omitted for directories.
          pattern: '^/api/preview/[1-9][0-9]*/[0-9a-f]{40}/files/.+$'
    CoursePreview:
      type: object
      additionalProperties: false
      required:
        - repoId
        - sha
        - outline
        - readmePresent
      properties:
        repoId: {$ref: '#/components/schemas/GitHubRepoId'}
        sha: {$ref: '#/components/schemas/CommitSha'}
        outline: {$ref: '#/components/schemas/CourseOutline'}
        readmePresent:
          type: boolean
          description: Whether root README.md exists at the same pinned commit.
        warnings:
          type: array
          description: Non-blocking warnings for this preview (O2). Omitted when there are none.
          items: {$ref: '#/components/schemas/CoursePreviewWarning'}
    CoursePreviewWarning:
      type: object
      additionalProperties: false
      required: [code, message, path]
      properties:
        code:
          type: string
          description: Stable warning code, such as cover_too_small, cover_format, or cover_too_large.
        message: {type: string}
        path:
          type: string
          description: Validated repository-relative path of the affected file.
    CourseOutline:
      type: object
      description: Read-only view of validated course content (ADR-0003, ADR-0011).
      additionalProperties: false
      required: [course, nodes, assignments]
      properties:
        course: {$ref: '#/components/schemas/OutlineCourse'}
        nodes:
          type: array
          description: Top-level entries in manifest order.
          items: {$ref: '#/components/schemas/CourseOutlineNode'}
        assignments:
          type: array
          items: {$ref: '#/components/schemas/OutlineAssignment'}
        display: {$ref: '#/components/schemas/OutlineDisplay'}
    OutlineCourse:
      type: object
      additionalProperties: false
      required: [id, title, summary, language, version]
      properties:
        id: {$ref: '#/components/schemas/ManifestId'}
        title: {type: string}
        summary: {type: string}
        description: {type: string}
        language: {type: string}
        version: {type: string}
        license: {type: string}
        tags:
          type: array
          items: {type: string}
        authors:
          type: array
          items: {$ref: '#/components/schemas/OutlineAuthor'}
        homepage: {type: string, format: uri}
        estimatedMinutes: {type: integer, minimum: 0}
        level:
          type: string
          enum: [introductory, intermediate, advanced, mixed]
        cover:
          type: string
          description: Repository-relative cover image hint. Omitted from previews that use the placeholder (O2).
        publishedAt: {type: string, format: date-time}
    OutlineAuthor:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: {type: string}
        url: {type: string, format: uri}
    CourseOutlineNode:
      type: object
      additionalProperties: false
      required: [id, kind, title, children, resources]
      properties:
        id: {$ref: '#/components/schemas/ManifestId'}
        kind:
          type: string
          enum: [module, lesson, assignment]
        title: {type: string}
        description: {type: string}
        recordedAt: {type: string, format: date-time}
        children:
          type: array
          description: Module children in manifest order. Empty for lessons and assignment links.
          items: {$ref: '#/components/schemas/CourseOutlineNode'}
        resources:
          type: array
          description: Lesson resources in manifest order. Empty for modules and assignment links.
          items: {$ref: '#/components/schemas/OutlineResource'}
        assignmentId:
          $ref: '#/components/schemas/ManifestId'
          description: Assignment ID for an assignment link.
    OutlineResource:
      type: object
      additionalProperties: false
      required: [id, kind, title, href]
      properties:
        id: {$ref: '#/components/schemas/ManifestId'}
        kind:
          type: string
          enum: [auto, pdf, notebook, markdown, image, video, audio, text, code, file, folder, external]
        title: {type: string}
        description: {type: string}
        href:
          type:
            - string
            - 'null'
          format: uri-reference
          pattern: '^/api/(?:preview/[1-9][0-9]*/[0-9a-f]{40}/(?:content|folders)|courses/[a-z][a-z0-9]*(?:-[a-z0-9]+)*/content)/(?:assignment~)?[a-z][a-z0-9]*(?:-[a-z0-9]+)*/[a-z][a-z0-9]*(?:-[a-z0-9]+)*$'
          description: Same-origin scoped content route (ADR-0008). Null for URL-only resources.
        path:
          type: string
          description: Repository-relative path at the pinned commit; used to resolve relative links and images in Markdown.
        url:
          type: string
          format: uri
          description: External HTTPS link without user credentials for a resource without a repository path or canonical embed.
        provider:
          type: string
          enum: [youtube, vimeo, external]
          description: Provider for a URL-backed video. External videos are link-only.
        embedUrl:
          type: string
          format: uri
          description: Canonical player URL from validation for an allowlisted video provider.
        mediaType:
          type: string
          description: Advisory MIME hint.
        fileExtension:
          type: string
          description: Lowercase filename suffix without the dot, if known.
        sizeBytes:
          type: integer
          format: int64
          minimum: 0
          description: Resource size in bytes when available from repository metadata.
        language: {type: string}
        display:
          type: string
          enum: [inline, attachment, auto]
        preview: {type: boolean}
        download: {type: boolean}
        recursive: {type: boolean}
        maxEntries: {type: integer, minimum: 1, maximum: 1000}
    OutlineAssignment:
      type: object
      additionalProperties: false
      required: [id, title, resources]
      properties:
        id: {$ref: '#/components/schemas/ManifestId'}
        title: {type: string}
        description: {type: string}
        releaseAt: {type: string, format: date-time}
        openAt: {type: string, format: date-time}
        dueAt: {type: string, format: date-time}
        closeAt: {type: string, format: date-time}
        resources:
          type: array
          description: Instruction resources in manifest order.
          items: {$ref: '#/components/schemas/OutlineResource'}
    OutlineDisplay:
      type: object
      additionalProperties: false
      properties:
        showEstimatedDuration: {type: boolean}
        showFileDownloads: {type: boolean}
        themeAccent: {type: string}
    BinaryContent:
      type: string
      format: binary
    CourseRef:
      type: object
      required:
        - courseId
        - status
        - repoId
      properties:
        courseId: {$ref: '#/components/schemas/ManifestId'}
        status:
          type: string
        repoId: {$ref: '#/components/schemas/GitHubRepoId'}
    CheckoutRequest:
      type: object
      additionalProperties: false
      required:
        - offerId
      properties:
        offerId:
          type: string
    DeferredJson:
      type: object
      description: Payload fields are defined in the operation's indicated milestone.
      additionalProperties: true
    PagedResult:
      type: object
      required:
        - nextCursor
      properties:
        nextCursor:
          type:
            - string
            - 'null'
          description: Opaque continuation cursor, or null at the end of the list.
      additionalProperties: true
    CatalogPage:
      type: object
      additionalProperties: false
      required:
        - items
        - nextCursor
        - generatedAt
      properties:
        items:
          type: array
          maxItems: 50
          items: {$ref: '#/components/schemas/DeferredJson'}
        nextCursor:
          type:
            - string
            - 'null'
        generatedAt:
          type: string
          format: date-time
