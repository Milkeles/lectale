openapi: 3.1.0
info:
  title: Lectale API
  version: 4.0.0
  description: Corrected contract for E1, E2, E3 and E7. Browser mutations using WebSession require a
    same-origin Origin and a session-bound X-CSRF-Token. Native clients use a verified Firebase ID bearer
    token. Access to managed course data is checked against server-side policy.
servers:
  - url: /api
paths:
  /auth/session:
    post:
      operationId: createWebSession
      summary: Exchange Firebase ID token for host-only opaque web session cookie
      description: Exchange a verified Firebase bearer token after an exact Origin check. The response
        sets the host-only HttpOnly session cookie and carries no body.
      security:
        - FirebaseBearer: []
      x-lectale-milestone: M3
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '204':
          description: Session cookie set
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Opaque __Host-course_session cookie with Secure, HttpOnly, SameSite=Lax and
                Path=/.
            Cache-Control: {$ref: '#/components/headers/NoStore'}
        '401':
          description: Invalid ID token
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
        4XX: {$ref: '#/components/responses/ClientError'}
        5XX: {$ref: '#/components/responses/ServerError'}
  /auth/me:
    get:
      operationId: getCurrentUser
      summary: Return current user profile and coarse permissions
      security:
        - WebSession: []
        - FirebaseBearer: []
      x-lectale-milestone: M3
      responses:
        '200':
          description: Authenticated profile
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeferredJson'}
        4XX: {$ref: '#/components/responses/ClientError'}
        5XX: {$ref: '#/components/responses/ServerError'}
  /auth/csrf:
    get:
      operationId: getCsrfToken
      summary: Retrieve session-bound CSRF token, no-store
      security:
        - WebSession: []
      x-lectale-milestone: M3
      responses:
        '200':
          description: CSRF token for X-CSRF-Token header
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeferredJson'}
        4XX: {$ref: '#/components/responses/ClientError'}
        5XX: {$ref: '#/components/responses/ServerError'}
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke D1 web session and expire cookie
      security:
        - WebSession: []
      x-lectale-milestone: M3
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '204':
          description: Logout completed
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Expires the host-only session cookie.
            Cache-Control: {$ref: '#/components/headers/NoStore'}
        4XX: {$ref: '#/components/responses/ClientError'}
        5XX: {$ref: '#/components/responses/ServerError'}
  /courses:
    get:
      operationId: listCatalogCourses
      summary: Optional public opt-in catalog; independent of repository-by-URL reading
      description: Only managed, published, explicitly listed public-safe metadata. No GitHub fetch per
        result; private paid courses may show safe teasers. Cached GET hits still count as Worker requests.
      security: []
      x-lectale-milestone: M10
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 120
          description: 1-5 normalized exact search tokens, indexed; no full scans
        - name: language
          in: query
          required: false
          schema:
            type: string
            maxLength: 20
          description: BCP47 language filter
        - name: category
          in: query
          required: false
          schema:
            type: string
            maxLength: 64
          description: Selected public-safe category
        - name: price
          in: query
          required: false
          schema:
            type: string
            enum:
              - free
              - paid
          description: Fee category filter
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
          description: Default 20
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 600
          description: Opaque bounded keyset cursor
      responses:
        '200':
          description: Public catalog
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CatalogPage'}
        4XX: {$ref: '#/components/responses/ClientError'}
        5XX: {$ref: '#/components/responses/ServerError'}
  /courses/import:
    post:
      operationId: importCourse
      summary: Open a public GitHub course by repository URL
      description: >
        Resolve the repository to a numeric ID and a full commit SHA, and validate course.yaml at that
        commit. This is a read-only preview with no GitHub writes, course registration, or catalog listing
        (E1, E3, V4-CORE-01). Accept canonical HTTPS GitHub repository URLs only and apply the class D
        repository lookup cache (up to 300 seconds, with negative lookups up to 30 seconds).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ImportCourseRequest'}
      responses:
        '200':
          description: Validated preview at a single pinned commit
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CoursePreview'}
        '400':
          description: Invalid GitHub repository URL or request body
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
        '404': {$ref: '#/components/responses/PreviewUnavailable'}
        '413':
          description: Course manifest exceeds the input size limit
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
        '422':
          description: Missing course.yaml or invalid course manifest
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
        '429': {$ref: '#/components/responses/PreviewThrottled'}
        4XX: {$ref: '#/components/responses/ClientError'}
        5XX: {$ref: '#/components/responses/ServerError'}
  /courses/register:
    post:
      operationId: registerCourse
      summary: Verify GitHub management rights, then register course in D1
      security:
        - WebSession: []
        - FirebaseBearer: []
      x-lectale-milestone: M4
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeferredJson'}
      responses:
        '201':
          description: Registered draft course
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CourseRef'}
        4XX: {$ref: '#/components/responses/ClientError'}
        5XX: {$ref: '#/components/responses/ServerError'}
  /courses/{courseId}/initialize:
    parameters:
      - {$ref: '#/components/parameters/courseId'}
    post:
      operationId: initializeCourse
      summary: Explicitly create missing manifest/scaffold after verified GitHub rights
      security:
        - WebSession: []
        - FirebaseBearer: []
      x-lectale-milestone: M4
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeferredJson'}
      responses:
        '200':
          description: Repository initialization status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeferredJson'}
        4XX: {$ref: '#/components/responses/ClientError'}
        5XX: {$ref: '#/components/responses/ServerError'}
  /courses/{courseId}/publish:
    parameters:
      - {$ref: '#/components/parameters/courseId'}
    post:
      operationId: publishCourse
      summary: Validate pinned commit and approve effective security policy
      security:
        - WebSession: []
        - FirebaseBearer: []
      x-lectale-milestone: M4
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeferredJson'}
      responses:
        '200':
          description: Published course
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeferredJson'}
        4XX: {$ref: '#/components/responses/ClientError'}
        5XX: {$ref: '#/components/responses/ServerError'}
  /courses/{courseId}/manifest:
    parameters:
      - {$ref: '#/components/parameters/courseId'}
    get:
      operationId: getCourseManifest
      summary: Return the course outline at the pinned SHA
      security:
        # Public courses are readable anonymously (spec: public offers and
        # manifests); the Worker still checks access for private courses.
        - {}
        - WebSession: []
        - FirebaseBearer: []
      x-lectale-milestone: M4
      responses:
        '200':
          description: Course outline for the authorized reader, with managed course resource hrefs
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CourseOutline'}
        4XX: {$ref: '#/components/responses/ClientError'}
        5XX: {$ref: '#/components/responses/ServerError'}
  /courses/{courseId}/content/{lessonId}/{resourceId}:
    parameters:
      - {$ref: '#/components/parameters/courseId'}
      - {$ref: '#/components/parameters/lessonId'}
      - {$ref: '#/components/parameters/resourceId'}
    get:
      operationId: getCourseContent
      summary: Return or securely stream a canonical resource after access checks
      security:
        - WebSession: []
        - FirebaseBearer: []
      x-lectale-milestone: M4
      responses:
        '200':
          description: Content delivered with appropriate MIME and cache headers
          content:
            '*/*':
              schema: {$ref: '#/components/schemas/BinaryContent'}
        4XX: {$ref: '#/components/responses/ClientError'}
        5XX: {$ref: '#/components/responses/ServerError'}
      description: Resolve the scoped resource against the managed course's validated manifest (E2, ADR-0008).
        Check current access before serving content and mask inaccessible private course existence with
        404.
  /courses/{courseId}/enroll:
    parameters:
      - {$ref: '#/components/parameters/courseId'}
    post:
      operationId: enrollInCourse
      summary: Open enroll or request approval using D1 policy
      security:
        - WebSession: []
        - FirebaseBearer: []
      x-lectale-milestone: M5
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeferredJson'}
      responses:
        '201':
          description: Enrollment created with active or pending status
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeferredJson'}
        4XX: {$ref: '#/components/responses/ClientError'}
        5XX: {$ref: '#/components/responses/ServerError'}
  /courses/{courseId}/enrollments/{uid}:
    parameters:
      - {$ref: '#/components/parameters/courseId'}
      - {$ref: '#/components/parameters/uid'}
    patch:
      operationId: updateEnrollment
      summary: Instructor approves/revokes a learner
      security:
        - WebSession: []
        - FirebaseBearer: []
      x-lectale-milestone: M5
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeferredJson'}
      responses:
        '200':
          description: Enrollment state changed and audit logged
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeferredJson'}
        4XX: {$ref: '#/components/responses/ClientError'}
        5XX: {$ref: '#/components/responses/ServerError'}
  /courses/{courseId}/submissions/reserve:
    parameters:
      - {$ref: '#/components/parameters/courseId'}
    post:
      operationId: reserveSubmission
      summary: Authorize attempt and file metadata; create one-time upload reservation
      security:
        - WebSession: []
        - FirebaseBearer: []
      x-lectale-milestone: M6
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeferredJson'}
      responses:
        '201':
          description: Upload reservation with safe provider-specific delegated action
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeferredJson'}
        4XX: {$ref: '#/components/responses/ClientError'}
        5XX: {$ref: '#/components/responses/ServerError'}
  /courses/{courseId}/submissions/{submissionId}/finalize:
    parameters:
      - {$ref: '#/components/parameters/courseId'}
      - {$ref: '#/components/parameters/submissionId'}
    post:
      operationId: finalizeSubmission
      summary: Verify uploaded objects and finalize immutable attempt
      security:
        - WebSession: []
        - FirebaseBearer: []
      x-lectale-milestone: M6
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeferredJson'}
      responses:
        '200':
          description: Finalized submitted attempt
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeferredJson'}
        '409':
          description: Reservation already finalized or in conflict
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
        4XX: {$ref: '#/components/responses/ClientError'}
        5XX: {$ref: '#/components/responses/ServerError'}
  /courses/{courseId}/submissions:
    parameters:
      - {$ref: '#/components/parameters/courseId'}
    get:
      operationId: listSubmissions
      summary: Student sees own attempts; staff see authorized course attempts
      security:
        - WebSession: []
        - FirebaseBearer: []
      x-lectale-milestone: M6
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Scoped submission list
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PagedResult'}
        4XX: {$ref: '#/components/responses/ClientError'}
        5XX: {$ref: '#/components/responses/ServerError'}
  /courses/{courseId}/grades/{assignmentId}/{uid}:
    parameters:
      - {$ref: '#/components/parameters/courseId'}
      - {$ref: '#/components/parameters/assignmentId'}
      - {$ref: '#/components/parameters/uid'}
    put:
      operationId: recordGrade
      summary: Authorized staff records manual grade and immutable audit revision
      security:
        - WebSession: []
        - FirebaseBearer: []
      x-lectale-milestone: M7
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeferredJson'}
      responses:
        '200':
          description: Authoritative grade updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeferredJson'}
        4XX: {$ref: '#/components/responses/ClientError'}
        5XX: {$ref: '#/components/responses/ServerError'}
  /certificates/{certificateId}:
    parameters:
      - {$ref: '#/components/parameters/certificateId'}
    get:
      operationId: verifyCertificate
      summary: Public certificate verification endpoint with limited disclosure
      security: []
      x-lectale-milestone: M7
      responses:
        '200':
          description: Verification status; no private grade details by default
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeferredJson'}
        4XX: {$ref: '#/components/responses/ClientError'}
        5XX: {$ref: '#/components/responses/ServerError'}
  /github/webhook:
    post:
      operationId: receiveGitHubWebhook
      summary: Verify GitHub signature then deduplicate and handle events
      description: Verify the HMAC over the raw request bytes before parsing. Deduplicate by GitHub delivery ID.
      security:
        - GitHubSignature: []
      x-lectale-milestone: M4
      parameters:
        - name: X-GitHub-Delivery
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeferredJson'}
      responses:
        '202':
          description: Event accepted or deduplicated
        4XX: {$ref: '#/components/responses/ClientError'}
        5XX: {$ref: '#/components/responses/ServerError'}
  /courses/{courseId}/grades/my:
    parameters:
      - {$ref: '#/components/parameters/courseId'}
    get:
      operationId: listMyGrades
      summary: Return own grades only, scoped from authenticated UID; no user UID parameter
      security:
        - WebSession: []
        - FirebaseBearer: []
      x-lectale-milestone: M7
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Current authenticated student grades
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PagedResult'}
        '403':
          description: Not an enrolled learner
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
        4XX: {$ref: '#/components/responses/ClientError'}
        5XX: {$ref: '#/components/responses/ServerError'}
  /courses/{courseId}/certificates:
    parameters:
      - {$ref: '#/components/parameters/courseId'}
    post:
      operationId: issueCertificate
      summary: Authorized instructor issues certificate with name/title/commit snapshot and audit
      security:
        - WebSession: []
        - FirebaseBearer: []
      x-lectale-milestone: M7
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeferredJson'}
      responses:
        '201':
          description: New verifiable certificate record
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeferredJson'}
        '403':
          description: Insufficient permissions
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
        4XX: {$ref: '#/components/responses/ClientError'}
        5XX: {$ref: '#/components/responses/ServerError'}
  /courses/{courseId}/staff:
    parameters:
      - {$ref: '#/components/parameters/courseId'}
    get:
      operationId: listCourseStaff
      summary: List course staff; private membership requires staff permission
      security:
        - WebSession: []
        - FirebaseBearer: []
      x-lectale-milestone: M5
      parameters:
        - {$ref: '#/components/parameters/Limit'}
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Scoped staff list
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PagedResult'}
        4XX: {$ref: '#/components/responses/ClientError'}
        5XX: {$ref: '#/components/responses/ServerError'}
    post:
      operationId: addCourseStaff
      summary: Only owner adds authorized staff based on verified identity
      security:
        - WebSession: []
        - FirebaseBearer: []
      x-lectale-milestone: M5
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeferredJson'}
      responses:
        '201':
          description: Role assignment recorded and audited
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeferredJson'}
        4XX: {$ref: '#/components/responses/ClientError'}
        5XX: {$ref: '#/components/responses/ServerError'}
  /creators/payments/onboard:
    post:
      operationId: startCreatorOnboarding
      summary: Start Stripe-hosted Connect onboarding for verified instructor; return temporary provider
        URL
      security:
        - WebSession: []
        - FirebaseBearer: []
      x-lectale-milestone: M9
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeferredJson'}
      responses:
        '200':
          description: Operation processed, authorization rules apply
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeferredJson'}
        '403':
          description: Forbidden
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
        4XX: {$ref: '#/components/responses/ClientError'}
        5XX: {$ref: '#/components/responses/ServerError'}
  /creators/payments/status:
    get:
      operationId: getCreatorPaymentStatus
      summary: Return verified account onboarding state; never expose account secrets
      security:
        - WebSession: []
        - FirebaseBearer: []
      x-lectale-milestone: M9
      responses:
        '200':
          description: Operation processed, authorization rules apply
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeferredJson'}
        '403':
          description: Forbidden
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
        4XX: {$ref: '#/components/responses/ClientError'}
        5XX: {$ref: '#/components/responses/ServerError'}
  /courses/{courseId}/offers:
    parameters:
      - {$ref: '#/components/parameters/courseId'}
    get:
      operationId: getCourseOffer
      summary: Return active sale price, currency and status; no private content
      security:
        # Public courses are readable anonymously (spec: public offers and
        # manifests); the Worker still checks access for private courses.
        - {}
        - WebSession: []
        - FirebaseBearer: []
      x-lectale-milestone: M9
      responses:
        '200':
          description: Operation processed, authorization rules apply
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeferredJson'}
        4XX: {$ref: '#/components/responses/ClientError'}
        5XX: {$ref: '#/components/responses/ServerError'}
  /courses/{courseId}/offers/configure:
    parameters:
      - {$ref: '#/components/parameters/courseId'}
    post:
      operationId: configureCourseOffer
      summary: Only verified owner may create/retire an offer; immutable versioned price and fee 500 bps
      security:
        - WebSession: []
        - FirebaseBearer: []
      x-lectale-milestone: M9
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeferredJson'}
      responses:
        '200':
          description: Operation processed, authorization rules apply
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeferredJson'}
        '403':
          description: Forbidden
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
        4XX: {$ref: '#/components/responses/ClientError'}
        5XX: {$ref: '#/components/responses/ServerError'}
  /courses/{courseId}/checkout:
    parameters:
      - {$ref: '#/components/parameters/courseId'}
    post:
      operationId: createCheckout
      summary: Authenticated learner creates idempotent Stripe-hosted checkout; no client-specified amount
      security:
        - WebSession: []
        - FirebaseBearer: []
      x-lectale-milestone: M9
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CheckoutRequest'}
      responses:
        '201':
          description: Order and Stripe-hosted Checkout Session created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeferredJson'}
        '403':
          description: Forbidden
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
        4XX: {$ref: '#/components/responses/ClientError'}
        5XX: {$ref: '#/components/responses/ServerError'}
        '409':
          description: Already entitled or checkout intent conflicts
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
  /orders/{orderId}:
    parameters:
      - {$ref: '#/components/parameters/orderId'}
    get:
      operationId: getOrder
      summary: Buyer views own order status; redirect is not payment proof
      security:
        - WebSession: []
        - FirebaseBearer: []
      x-lectale-milestone: M9
      responses:
        '200':
          description: Operation processed, authorization rules apply
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeferredJson'}
        '403':
          description: Forbidden
          headers:
            Cache-Control: {$ref: '#/components/headers/NoStore'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
