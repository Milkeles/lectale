# Tests the spec contract, the Worker and the Flutter app, and builds the app
# for every platform, on each pull request and on main.
name: CI

on:
  pull_request:
  push:
    # Agent branches get CI before a pull request exists.
    branches: [main, "claude/**"]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract:
    name: Spec contract and project rules
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m pip install --user pyyaml jsonschema
      - name: Bundled specification tests
        run: cd spec/v4.0 && for t in tools/test_*.py; do python3 "$t"; done
      - name: Corrected OpenAPI contract tests
        run: python3 tool/test_openapi_contract.py
      - name: Rule check and guard tests
        run: |
          python3 -m unittest discover -s tool -p 'test_*.py'
          python3 tool/check_rules.py

  edge:
    name: Worker
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install_args: node
      # The Worker's types come from the contract; regenerating must change
      # nothing, or the committed types have drifted from spec/errata/openapi.yaml.
      - name: Generated types match the contract
        working-directory: tool/codegen
        run: |
          npm ci
          npm run generate
          git diff --exit-code -- ../../apps/edge_api/src/generated
          test -z "$(git status --porcelain -- ../../apps/edge_api/src/generated)"
      - working-directory: apps/edge_api
        run: |
          npm ci
          npm run typecheck
          mkdir -p build/assets
          npm test

  site:
    name: Static site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install_args: node
      # The orbit test drives Chromium through Playwright, pinned in
      # apps/site/package.json, to check every moment of the hero's quote orbit.
      - working-directory: apps/site
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
          npm test

  # Jobs that need devchat_ui run only when the deploy key exists. Pull
  # requests from forks never receive it, so they stop here with a notice.
  litse-ui:
    name: litse-ui access
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions: {}
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - id: check
        env:
          HAS_KEY: ${{ secrets.LITSE_UI_DEPLOY_KEY != '' }}
        run: |
          echo "available=$HAS_KEY" >> "$GITHUB_OUTPUT"
          if [ "$HAS_KEY" != "true" ] && [ "$GITHUB_REF" = "refs/heads/main" ]; then
            echo "::error::LITSE_UI_DEPLOY_KEY is missing on main, so the Flutter checks cannot run."
            exit 1
          fi
          if [ "$HAS_KEY" != "true" ]; then
            echo "::notice::LITSE_UI_DEPLOY_KEY is not set, so the Flutter jobs are skipped. See docs/runbooks/litse-ui-deploy-key.md."
          fi

  flutter:
    name: Flutter analyze and test
    needs: litse-ui
    if: needs.litse-ui.outputs.available == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/litse-ui-access
        with:
          deploy-key: ${{ secrets.LITSE_UI_DEPLOY_KEY }}
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install_args: flutter
      - run: flutter pub get --enforce-lockfile
      # devchat_ui is in the pub cache now; nothing later needs the key.
      - run: rm -f ~/.ssh/litse_ui
        shell: bash
      - name: Check generated Dart API client
        shell: bash
        run: |
          dart run swagger_parser -f contracts/swagger_parser.yaml
          dart format packages/api_client
          changes="$(git status --porcelain --untracked-files=all -- packages/api_client)"
          if [ -n "$changes" ]; then
            printf '%s\n' "$changes"
            exit 1
          fi
      - run: dart format --output=none --set-exit-if-changed apps
      - run: dart analyze --fatal-infos
      - name: Test Flutter and the API client
        run: |
          (cd apps/flutter_client && flutter test)
          (cd packages/api_client && flutter test)

  build:
    name: Build ${{ matrix.target }}
    needs: litse-ui
    if: needs.litse-ui.outputs.available == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # `download` is what the run keeps for people to try, relative to
          # apps/flutter_client; empty means nothing installable (web is
          # deployed instead, and an unsigned iOS build can't be installed).
          - { target: web, os: ubuntu-24.04, command: flutter build web --release --base-href /app/, download: "" }
          - { target: linux, os: ubuntu-24.04, command: flutter build linux --release, download: lectale-linux-x64.tar.gz }
          - { target: android, os: ubuntu-24.04, command: flutter build apk --debug, download: build/app/outputs/flutter-apk/app-debug.apk }
          - { target: windows, os: windows-latest, command: flutter build windows --release, download: build/windows/x64/runner/Release }
          - { target: macos, os: macos-latest, command: flutter build macos --release, download: lectale-macos.tar.gz }
          - { target: ios, os: macos-latest, command: flutter build ios --release --no-codesign, download: "" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/litse-ui-access
        with:
          deploy-key: ${{ secrets.LITSE_UI_DEPLOY_KEY }}
      - if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
      - if: matrix.target == 'android'
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: jdx/mise-action@236a21c3b91f5db6d4e174b348674a0f0caac06d # v5.2.9
        with:
          install_args: flutter
      - run: flutter pub get --enforce-lockfile
      # devchat_ui is in the pub cache now; nothing later needs the key.
      - run: rm -f ~/.ssh/litse_ui
        shell: bash
      - working-directory: apps/flutter_client
        shell: bash
        run: ${{ matrix.command }}
      # A zip drops the executable bit and the app bundle's symlinks, so the
      # Linux and macOS builds are packed with tar first.
      - name: Pack the build for download
        if: matrix.target == 'linux' || matrix.target == 'macos'
        working-directory: apps/flutter_client
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if [ "$TARGET" = linux ]; then
            tar -czf lectale-linux-x64.tar.gz -C build/linux/x64/release/bundle .
          else
            tar -czf lectale-macos.tar.gz -C build/macos/Build/Products/Release lectale.app
          fi
      - name: Keep the build for a week
        if: matrix.download != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lectale-${{ matrix.target }}
          path: apps/flutter_client/${{ matrix.download }}
          retention-days: 7
          if-no-files-found: error
