# Dart packages are not listed: Dependabot can't clone the private
# litse-ui-private, so every pub update fails. osv-scanner still checks
# pubspec.lock weekly (security.yml), and `just outdated` lists updates.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
  - package-ecosystem: npm
    directories: [/apps/edge_api, /tool/codegen]
    schedule: { interval: weekly }
    groups:
      npm: { patterns: ["*"] }
