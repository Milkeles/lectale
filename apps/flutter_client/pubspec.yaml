name: lectale
description: Read GitHub-hosted courses in one app on web, mobile and desktop.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.14.0

resolution: workspace

dependencies:
  # The component library (ADR-0004). Pinned to a commit until litse-ui tags
  # a release on Flutter 3.50; CI reaches it with the deploy key.
  devchat_ui:
    git:
      url: https://github.com/Milkeles/litse-ui-private.git
      ref: 1ba314a75a9de1ba23acdb0c5490d7df8bf4710e
  # The generated client's transport; the app builds the one Dio instance.
  dio: ^5.11.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  lectale_api_client: ^0.1.0
  resource_renderers: ^0.1.0
  # Opens a link or a download outside the app: the browser, or the system's
  # handler. Used only by the preview's ResourceHost.
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  generate: false
  fonts:
    # The reading face (ADR-0012): the upstream variable files, unmodified,
    # because the licence reserves the name "Source" for unmodified fonts.
    # Their licence is beside them in assets/fonts/LICENSE.md.
    - family: Source Serif 4
      fonts:
        - asset: assets/fonts/SourceSerif4Variable-Roman.ttf
        - asset: assets/fonts/SourceSerif4Variable-Italic.ttf
          style: italic
