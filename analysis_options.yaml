include: package:very_good_analysis/analysis_options.11.0.0.yaml

formatter:
  page_width: 80
  trailing_commas: automate

analyzer:
  exclude:
    - "**/build/**"
    - "**/lib/src/data/api/**"
    - "**/lib/src/l10n/gen/**"
    - "spec/**"
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # Flutter's own conventions: constructors named after the type
    # (`const DcButton(...)`) and static factories such as `lerp` and `of`.
    unnecessary_type_name_in_constructor: false
    prefer_constructors_over_static_methods: false
